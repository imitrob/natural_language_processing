<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speech alternatives</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202b;
      --muted: #66717f;
      --hairline: rgba(23, 32, 43, .12);
      --paper: #f5f3ed;
      --accent: #de5c36;
      --live: #2b8a69;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 72% 20%, rgba(222, 92, 54, .10), transparent 28rem),
        radial-gradient(circle at 20% 80%, rgba(57, 118, 145, .10), transparent 30rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .25;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.08'/%3E%3C/svg%3E");
    }

    .shell {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      padding: clamp(1.25rem, 3vw, 2.75rem);
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .brand { color: var(--ink); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      transition: color .2s ease;
    }

    .status::before {
      content: "";
      width: .52rem;
      height: .52rem;
      border-radius: 50%;
      background: #aa8f43;
      box-shadow: 0 0 0 .25rem rgba(170, 143, 67, .12);
    }

    .status.live { color: var(--live); }
    .status.live::before {
      background: var(--live);
      box-shadow: 0 0 0 .25rem rgba(43, 138, 105, .12);
    }

    main {
      display: grid;
      place-items: center;
      min-width: 0;
    }

    .stage {
      width: min(100%, 90rem);
      min-width: 0;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 clamp(2rem, 5vh, 4rem);
      color: var(--accent);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .prediction::-webkit-scrollbar { display: none; }

    .prediction {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(.7rem, 2.2vw, 2.5rem);
      min-height: 19rem;
      padding: 1rem;
      overflow-x: auto;
      /* ponytail: scrollable but bar hidden; drop these 2 rules to get it back */
      scrollbar-width: none;
    }

    .empty {
      color: rgba(23, 32, 43, .34);
      font-family: ui-serif, Georgia, serif;
      font-size: clamp(2rem, 5vw, 4.6rem);
      font-style: italic;
      letter-spacing: -.035em;
    }

    .listening {
      color: rgba(23, 32, 43, .5);
      font-family: ui-serif, Georgia, serif;
      font-size: clamp(2rem, 5vw, 4.6rem);
      font-style: italic;
      letter-spacing: -.035em;
    }

    .listening i {
      font-style: inherit;
      animation: pulse 1.1s ease-in-out infinite;
    }

    .listening i:nth-child(2) { animation-delay: .16s; }
    .listening i:nth-child(3) { animation-delay: .32s; }

    @keyframes pulse {
      0%, 100% { opacity: .15; }
      50% { opacity: 1; }
    }

    .word-column {
      flex: 0 0 auto;
      display: grid;
      grid-template-rows: 7rem auto 7rem;
      justify-items: center;
      min-width: max(4.5rem, max-content);
      animation: arrive .48s cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: calc(var(--index) * 55ms);
    }

    .alternatives {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .55rem;
      width: 100%;
      color: #2b3542;
    }

    .alternatives.above {
      flex-direction: column-reverse;
      justify-content: flex-start;
    }

    .alternative {
      display: inline-flex;
      align-items: baseline;
      gap: .38rem;
      max-width: 13rem;
      opacity: .8;
      font-size: clamp(.95rem, 1.5vw, 1.35rem);
      line-height: 1.15;
      white-space: nowrap;
    }

    .alternative small {
      font-size: .66em;
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
    }

    .chosen {
      position: relative;
      padding: .25rem .05rem .55rem;
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
      font-size: clamp(2rem, 4.8vw, 5.25rem);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: .95;
      white-space: nowrap;
    }

    .history {
      display: flex;
      justify-content: flex-end;
      gap: .85rem;
      min-width: 0;
      overflow: hidden;
      text-transform: none;
      letter-spacing: 0;
      font-size: .75rem;
      font-weight: 500;
    }

    .history span {
      overflow: hidden;
      max-width: 19rem;
      color: rgba(102, 113, 127, .7);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history span::before { content: "← "; color: var(--hairline); }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(.8rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .shell { padding: 1.15rem; }
      .prediction { justify-content: flex-start; min-height: 17rem; }
      .word-column { grid-template-rows: 6rem auto 6rem; }
      .history span:nth-child(n+2) { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .word-column { animation: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <span class="brand">STT / Alternatives</span>
      <span class="status" id="status">Connecting</span>
    </header>

    <main>
      <section class="stage" aria-live="polite" aria-atomic="true">
        <p class="eyebrow">Latest prediction</p>
        <div class="prediction" id="prediction">
          <span class="empty">Waiting for speech…</span>
        </div>
      </section>
    </main>

    <footer>
      <span>Likelihood fades with uncertainty &middot; only speech after “hey robot” is shown</span>
      <div class="history" id="history" aria-label="Previous predictions"></div>
    </footer>
  </div>

  <script>
    const prediction = document.querySelector("#prediction");
    const status = document.querySelector("#status");
    const historyNode = document.querySelector("#history");
    const history = [];
    let currentText = "";

    function emptyNode(text) {
      const node = document.createElement("span");
      node.className = "empty";
      node.textContent = text;
      return node;
    }

    function alternativeNode(alternative) {
      const node = document.createElement("span");
      node.className = "alternative";
      node.style.opacity = .55 + alternative.probability * .45;

      const word = document.createElement("span");
      word.textContent = alternative.word;
      const probability = document.createElement("small");
      probability.textContent = `${Math.round(alternative.probability * 100)}%`;
      node.append(word, probability);
      return node;
    }

    function render(payload) {
      if (currentText && currentText !== payload.text) {
        history.unshift(currentText);
        history.splice(3);
      }
      currentText = payload.text;
      prediction.replaceChildren();

      if (!payload.words?.length) {
        prediction.append(emptyNode("No speech detected"));
        return;
      }

      payload.words.forEach((word, index) => {
        const column = document.createElement("span");
        column.className = "word-column";
        column.style.setProperty("--index", index);

        const above = document.createElement("span");
        above.className = "alternatives above";
        const below = document.createElement("span");
        below.className = "alternatives below";

        word.alternatives.forEach((alternative, rank) => {
          (rank % 2 === 0 ? above : below).append(alternativeNode(alternative));
        });

        const chosen = document.createElement("span");
        chosen.className = "chosen";
        chosen.textContent = word.word;
        column.append(above, chosen, below);
        prediction.append(column);
      });

      historyNode.replaceChildren(...history.map(text => {
        const item = document.createElement("span");
        item.textContent = text;
        return item;
      }));
    }

    function showListening() {
      const node = document.createElement("span");
      node.className = "listening";
      node.append("Listening");
      for (let dot = 0; dot < 3; dot += 1) {
        node.append(Object.assign(document.createElement("i"), {textContent: "."}));
      }
      prediction.replaceChildren(node);
    }

    const events = new EventSource("/events");
    events.onopen = () => {
      status.textContent = "Live";
      status.classList.add("live");
    };
    events.onerror = () => {
      status.textContent = "Reconnecting";
      status.classList.remove("live");
    };
    events.onmessage = event => {
      const payload = JSON.parse(event.data);
      // While speech is being collected the animation replaces the words; once
      // it ends the last accepted prediction comes back, ignored or not.
      if (payload.listening) showListening();
      else if (payload.words) render(payload);
      else prediction.replaceChildren(emptyNode("Waiting for speech…"));
    };
  </script>
</body>
</html>
